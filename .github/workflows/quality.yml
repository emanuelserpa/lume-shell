name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install runtime and QML quality tools
        run: |
          pacman -Syu --needed --noconfirm \
            git quickshell qt6-5compat qt6-declarative \
            python python-pillow python-requests

      - name: Record toolchain versions
        run: |
          pacman -Q quickshell qt6-5compat qt6-declarative python
          /usr/lib/qt6/bin/qmllint --version
          quickshell --version

      - name: Run offline validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./scripts/validate.sh --offline
