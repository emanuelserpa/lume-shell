name: Build Arch package for release

on:
  push:
    tags:
      - 'v*'

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  arch-package:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare Arch build tools and unprivileged builder
        run: |
          pacman -Syu --needed --noconfirm git github-cli sudo
          useradd --create-home --uid 1001 builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package from this release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "Release tags must look like v1.2.3; got $GITHUB_REF_NAME" >&2
            exit 1
          }
          commit="$(runuser -u builder -- git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          test "$commit" = "$GITHUB_SHA"
          tag_commit="$(runuser -u builder -- git -C "$GITHUB_WORKSPACE" \
            rev-parse "${GITHUB_REF}^{commit}")"
          test "$tag_commit" = "$commit"
          cd "$GITHUB_WORKSPACE/packaging/arch"
          runuser -u builder -- env \
            _release_pkgver="$version" \
            _release_commit="$commit" \
            _local_source="$GITHUB_WORKSPACE" \
            makepkg --syncdeps --cleanbuild --noconfirm

      - name: Store package for the approval-gated publish job
        uses: actions/upload-artifact@v4
        with:
          name: lume-shell-${{ github.ref_name }}
          path: packaging/arch/lume-shell-*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: arch-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    steps:
      - name: Download the package built from this tag
        uses: actions/download-artifact@v4
        with:
          name: lume-shell-${{ github.ref_name }}
          path: dist

      - name: Create GitHub release and attach package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_file="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 \
            -type f -name 'lume-shell-*.pkg.tar.zst' -print -quit)"
          test -n "$package_file"
          sha256sum "$package_file" > "${package_file}.sha256"
          gh release create "$GITHUB_REF_NAME" "$package_file" \
            "${package_file}.sha256" \
            --verify-tag --generate-notes --title "Lume ${GITHUB_REF_NAME#v}"
